# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuring-dependabot-version-updates#enabling-github-dependabot-version-updates
# https://til.simonwillison.net/github/dependabot-python-setup

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Keep pinned for torch.package model compatibility
      - dependency-name: "segmentation-models-pytorch"
        versions: [">0.4.0"]
      - dependency-name: "albumentations"
        versions: [">2.0.5"]
    groups:
      python-packages:
        patterns:
          - "*"
